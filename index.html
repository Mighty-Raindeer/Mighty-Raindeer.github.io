    <script>
        // Navigation helpers retained for onclick handlers; analytics intentionally not configured.

    <style>
        :root {
            --bg-primary: #07111f;
            --bg-secondary: #0d1d31;
            --bg-card: #112a44;
            --text-primary: #edf8ff;
            --text-secondary: #9bb8cd;
            --accent-primary: #5dd6ff;
            --accent-hover: #9ae8ff;
            --accent-strong: #2d7cff;
            --border-color: rgba(142, 213, 255, 0.2);
            --halo: rgba(67, 181, 255, 0.36);
        }

        * { box-sizing: border-box; }

        html { background: var(--bg-primary); }

        body {
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 50% 62%, rgba(39, 123, 255, 0.19), transparent 29rem),
                radial-gradient(circle at 5% 8%, rgba(54, 209, 255, 0.12), transparent 21rem),
                linear-gradient(135deg, #07111f 0%, #081a2e 52%, #06101c 100%);
            color: var(--text-primary);
            font-family: Avenir, "Avenir Next", "Segoe UI", sans-serif;
        }

        .site-shell {
            width: min(1120px, calc(100% - 3rem));
            min-height: 100vh;
            margin: 0 auto;
            padding: clamp(2rem, 5vw, 4.75rem) 0 1.75rem;
            display: flex;
            flex-direction: column;
        }

        .hero {
            position: relative;
            z-index: 1;
            max-width: 680px;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            margin: 0 0 0.9rem;
            color: var(--accent-primary);
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            width: 2.5rem;
            height: 1px;
            content: "";
            background: currentColor;
            box-shadow: 0 0 14px var(--accent-primary);
        }

        .hero h1 {
            max-width: 12ch;
            margin: 0;
            font-size: clamp(2.75rem, 7vw, 5.8rem);
            font-weight: 650;
            line-height: 0.92;
            letter-spacing: -0.075em;
            text-wrap: balance;
        }

        .hero p {
            max-width: 43rem;
            margin: 1.35rem 0 0;
            color: var(--text-secondary);
            font-size: clamp(0.95rem, 1.8vw, 1.12rem);
            letter-spacing: 0.01em;
            line-height: 1.6;
        }

        .orbit-stage {
            width: min(100%, 37rem);
            aspect-ratio: 1;
            margin: clamp(1.5rem, 0.5vw, 3rem) auto 0;
            position: relative;
            isolation: isolate;
        }

        .orbit-stage::before {
            position: absolute;
            z-index: -2;
            inset: 10%;
            content: "";
            border: 1px solid rgba(152, 222, 255, 0.25);
            border-radius: 50%;
            box-shadow: inset 0 0 3rem rgba(50, 147, 255, 0.08), 0 0 4rem rgba(14, 90, 177, 0.14);
        }

        .orbit-stage::after {
            position: absolute;
            z-index: -1;
            inset: 7%;
            content: "";
            border-radius: 50%;
            background: conic-gradient(from 210deg, transparent 0 8%, rgba(85, 213, 255, 0.05) 18%, #6ee2ff 25%, transparent 31% 50%, rgba(35, 113, 255, 0.18) 60%, #347fff 69%, transparent 76% 100%);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
            filter: drop-shadow(0 0 12px rgba(93, 214, 255, 0.72));
            animation: orbit-spin 11s linear infinite;
        }

        .nav-card {
            --bubble-size: clamp(7.7rem, 20vw, 10.8rem);
            position: absolute;
            width: var(--bubble-size);
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            background: linear-gradient(145deg, rgba(29, 81, 129, 0.87), rgba(10, 29, 50, 0.95));
            box-shadow: 0 1.1rem 2.8rem rgba(0, 0, 0, 0.26), inset 0 1px 0 rgba(216, 247, 255, 0.2);
            color: var(--text-primary);
            text-align: center;
            text-decoration: none;
            transition: transform 260ms ease, background 260ms ease, border-color 260ms ease, box-shadow 260ms ease;
        }

        .nav-card::before {
            position: absolute;
            inset: 8px;
            content: "";
            border: 1px solid rgba(158, 229, 255, 0.12);
            border-radius: inherit;
            transition: opacity 260ms ease;
        }

        .nav-card h2 {
            position: relative;
            z-index: 1;
            max-width: 8ch;
            margin: 0;
            color: inherit;
            font-size: clamp(0.9rem, 2.2vw, 1.18rem);
            font-weight: 700;
            letter-spacing: -0.035em;
            line-height: 1.03;
            text-wrap: balance;
        }

        .nav-card:hover {
            border-color: rgba(155, 233, 255, 0.7);
            background: linear-gradient(145deg, rgba(48, 130, 194, 0.95), rgba(16, 56, 98, 0.97));
            box-shadow: 0 0 0 7px rgba(75, 196, 255, 0.08), 0 1.5rem 3rem rgba(0, 0, 0, 0.3), 0 0 2.6rem rgba(57, 179, 255, 0.32);
        }

        .nav-card:focus-visible {
            outline: 3px solid var(--accent-hover);
            outline-offset: 5px;
        }

        .nav-card:nth-of-type(1) { left: 50%; top: 10%; transform: translate(-50%, -50%); }
        .nav-card:nth-of-type(2) { left: 84.64%; top: 70%; transform: translate(-50%, -50%); }
        .nav-card:nth-of-type(3) { left: 15.36%; top: 70%; transform: translate(-50%, -50%); }

        .nav-card:nth-of-type(1):hover { transform: translate(-50%, calc(-50% - 0.55rem)); }
        .nav-card:nth-of-type(2):hover { transform: translate(-50%, calc(-50% - 0.55rem)); }
        .nav-card:nth-of-type(3):hover { transform: translate(-50%, calc(-50% - 0.55rem)); }

        footer {
            margin-top: auto;
            padding-top: 1.75rem;
            color: rgba(155, 184, 205, 0.7);
            font-size: 0.76rem;
            letter-spacing: 0.04em;
            text-align: center;
        }

        @keyframes orbit-spin { to { transform: rotate(1turn); } }

        @media (max-width: 640px) {
            .site-shell { width: min(100% - 2rem, 38rem); padding-top: 2.25rem; }
            .hero h1 { max-width: none; }
            .hero p { max-width: 31rem; }
            .orbit-stage { width: min(100%, 29rem); margin-top: 1.3rem; }
            .nav-card { --bubble-size: clamp(6.7rem, 30vw, 8.5rem); }
        }

        @media (max-width: 390px) {
            .nav-card { --bubble-size: 6.45rem; }
            .nav-card h2 { font-size: 0.79rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>

    <main class="site-shell">

        <nav class="orbit-stage" aria-label="Primary navigation">

            </a>
            <a href="cv.html" class="nav-card" onclick="trackNavigation('curriculum_vitae')">

            </a>
            <a href="https://github.com/Mighty-Raindeer" class="nav-card" target="_blank" rel="noopener" onclick="trackExternalLink('https://github.com/Mighty-Raindeer')">
                <h2>GitHub</h2>
            </a>
        </nav>

        <footer>© <span id="copyright-year"></span> Rainor Connor. All rights reserved.</footer>
    </main>

    <script>
        document.getElementById('copyright-year').textContent = String(new Date().getFullYear());
    </script>
